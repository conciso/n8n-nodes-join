name: Build and deploy Join custom node for n8n

on:
  push:
    branches:
      - "development"
      #- "feature/**"
      #- "bug/**"
  pull_request:
    branches:
      - "development"
  release:
    types: [published]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    if: github.event_name != 'release' && github.event_name != 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Lint code
      run: npm run lint
      
    - name: Build project
      run: npm run build:test

  deploy-staging:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment: staging
    
    steps:
    - name: Checkout PR code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Setup SSH
      run: |
        eval $(ssh-agent -s)
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-add ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts
        
    - name: Deploy to Staging
      run: npm run deploy:staging
      env:
        STAGING_DEPLOY_USER: ${{ secrets.STAGING_USER }}
        STAGING_DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
        STAGING_DEPLOY_PATH: ${{ secrets.STAGING_PATH }}
        STAGING_DEPLOY_CONTAINER: ${{ secrets.STAGING_CONTAINER_NAME }}

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/lcov.info
        flags: staging
        name: staging-tests
        fail_ci_if_error: false
      continue-on-error: true

    - name: Upload test results
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Staging Tests
        path: coverage/junit.xml
        reporter: jest-junit
        fail-on-error: true

    - name: Upload coverage as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: staging-coverage-report
        path: coverage/
        retention-days: 7

    - name: Publish Test Results in PR
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: 'Pull Request Test Results'
        path: 'coverage/junit.xml'
        reporter: jest-junit
        fail-on-error: false
        only-summary: false

    - name: Coverage Comment in PR
      uses: romeovs/lcov-reporter-action@v0.3.1
      if: success() || failure()
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        lcov-file: ./coverage/lcov.info
        delete-old-comments: true
      

  deploy-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Deploy to Production
      run: npm run deploy:production
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/lcov.info
        flags: production
        name: production-tests
        fail_ci_if_error: false
      continue-on-error: true

    - name: Upload test results
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Production Tests
        path: coverage/junit.xml
        reporter: jest-junit
        fail-on-error: true

    - name: Upload coverage as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: production-coverage-report
        path: coverage/
        retention-days: 90
